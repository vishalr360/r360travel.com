name: Build & Deploy Tripsure

on:
  push:
    branches: [main]
  workflow_dispatch:        # allow manual trigger from GitHub UI

env:
  AWS_REGION: ap-south-1
  ECR_REPO: tripsure
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build Docker image → push to ECR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPO 2>/dev/null \
            || aws ecr create-repository --repository-name $ECR_REPO

      - name: Build, tag, and push image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="${REGISTRY}/${ECR_REPO}"
          docker build \
            --platform linux/amd64 \
            -t "${IMAGE_URI}:${IMAGE_TAG}" \
            -t "${IMAGE_URI}:latest" \
            .
          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"
          echo "IMAGE=${IMAGE_URI}:latest" >> $GITHUB_ENV

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            REGISTRY="${{ steps.login-ecr.outputs.registry }}"

            # Login to ECR from server
            aws ecr get-login-password --region ${{ env.AWS_REGION }} \
              | docker login --username AWS --password-stdin "${REGISTRY}"

            # Pull new image
            docker pull "${REGISTRY}/${{ env.ECR_REPO }}:latest"

            # Zero-downtime swap
            docker stop tripsure-app 2>/dev/null || true
            docker rm   tripsure-app 2>/dev/null || true
            docker run -d \
              --name tripsure-app \
              -p 80:3000 \
              --restart unless-stopped \
              --env NODE_ENV=production \
              --env NEXT_TELEMETRY_DISABLED=1 \
              "${REGISTRY}/${{ env.ECR_REPO }}:latest"

            # Prune old images
            docker image prune -f

            echo "Deployed: ${REGISTRY}/${{ env.ECR_REPO }}:latest"

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          script: |
            for i in 1 2 3 4 5; do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/ || echo "000")
              echo "Attempt $i: HTTP $STATUS"
              [ "$STATUS" = "200" ] && echo "✅ Healthy" && exit 0
              sleep 5
            done
            echo "❌ Health check failed"
            docker logs tripsure-app --tail=50
            exit 1
