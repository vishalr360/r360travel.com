version: '3.8'

services:
  r360travel:
    build:
      context: .
      dockerfile: Dockerfile
    image: r360travel:latest
    container_name: r360travel-app
    ports:
      - "80:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  # Optional: Nginx reverse proxy for SSL termination
  # Uncomment if you need HTTPS support
